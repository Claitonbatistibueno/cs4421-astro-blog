name: Deploy Static Site via AWS CDK

on:
  push:
    branches: [main]

jobs:
  # Gate: run the full CI first. If lint, type check, unit tests, build
  # or CDK tests fail, the deploy job never starts.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build Astro static site
        run: npm run build

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy with AWS CDK
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json
        working-directory: cdk

      # Proves the release reached users: the live URL (read from the stack
      # output, not hard-coded) must serve the key pages with HTTP 200, and
      # the home page must be the Farm Project, not an old or empty build.
      - name: Smoke test the live site
        working-directory: cdk
        run: |
          URL=$(jq -r '.StaticSiteStack.SiteURL' cdk-outputs.json)
          echo "Testing $URL"
          for path in / /dashboard /reports /about; do
            curl -sSf --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL$path"
            echo "OK  $path"
          done
          curl -sSf "$URL/" | grep -q "<title>Farm Project" || { echo "Home page is not the Farm Project"; exit 1; }
          echo "OK  home page title"