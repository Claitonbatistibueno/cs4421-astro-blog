name: Continuous Integration

# Pull requests into either long-lived branch run CI directly.
# On main, CI is also called by the static deploy workflow, so nothing
# reaches S3 before every check has passed. On the SSR branch the
# container pipeline runs the same checks in its own quality gate.
on:
  pull_request:
    branches: [main, feat/server-side-rendering]
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Static Analysis & Tests
        run: |
          npm run lint
          npm run check
          npm run test:unit

      - name: Build Astro Site
        run: npm run build

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Test Infrastructure (CDK assertions)
        working-directory: cdk
        run: npm test