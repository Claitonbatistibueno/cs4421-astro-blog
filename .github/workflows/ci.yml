name: Continuous Integration

# Pull requests run CI directly. On main, CI is called by the deploy
# workflow, so nothing reaches production before every check has passed.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Static Analysis & Tests
        run: |
          npm run lint
          npm run check
          npm run test:unit

      - name: Build Astro Site
        run: npm run build

      # End-to-end tests run inside the required `validate` job, so a broken
      # page or an accessibility regression blocks the merge like any other test.
      - name: Install Browser for End-to-End Tests
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Tests (desktop and mobile, axe accessibility scan)
        run: npm run test:e2e

      - name: Keep the Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Test Infrastructure (CDK assertions)
        working-directory: cdk
        run: npm test